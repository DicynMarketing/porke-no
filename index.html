var LG={"tc": [["Acerca de estos Términos", "Estos Términos y Condiciones regulan el uso de la aplicación de pedidos de Porké No? (en adelante, el “Comercio”), ubicado en Aguadulce, Panamá. Se complementan con la Política de Privacidad y la Política de Pagos, Reembolsos y Créditos, que forman parte de ellos. Los términos en mayúscula tienen el significado que aquí se indica. Quien no esté de acuerdo debe abstenerse de usar la aplicación. Su uso implica la aceptación de estos Términos."], ["Quién vende y quién da la plataforma", "El vendedor de los productos es el Comercio: él prepara, cobra y es responsable de la calidad, el precio y la entrega de los pedidos. La aplicación es provista por DiCyn Marketing (el “Proveedor Tecnológico”), que solo ofrece la herramienta tecnológica. El Proveedor Tecnológico no vende, no prepara ni entrega los productos y no es parte de la compraventa entre el Usuario y el Comercio."], ["Capacidad y registro", "Solo pueden usar la aplicación personas con capacidad legal para contratar. El Usuario se compromete a proporcionar datos verdaderos, exactos y actualizados (nombre, teléfono, dirección de referencia y, si lo desea, correo electrónico), y responde por su veracidad. El Comercio puede solicitar información adicional para confirmar los datos y puede rechazar un registro o suspender una cuenta cuando detecte inconsistencias, actividad inusual o sospecha de fraude, sin que ello genere derecho a indemnización."], ["Pedidos", "Los precios, el costo de envío, la tarifa de servicio y el total se muestran antes de confirmar el pedido. Por el uso de la aplicación se cobra una tarifa de servicio de $0.15 por pedido, que se suma al total y no es reembolsable salvo que el pedido se cancele por causa del Comercio. El tiempo estimado es aproximado y puede variar por la demanda, el clima o el tráfico. Los productos agotados dejan de mostrarse en la aplicación; si un producto se agota después de confirmar el pedido, el Comercio podrá ofrecer un reemplazo o cancelar esa parte del pedido con su reembolso. El Usuario debe indicar una dirección o referencia suficiente y un teléfono de contacto; si no es posible entregar por datos incorrectos o ausencia del Usuario, el pedido podrá cancelarse sin reembolso cuando ya haya sido preparado. Los pedidos para recoger deben retirarse en el local en el horario indicado."], ["Pagos", "Los métodos de pago, los cobros, los reembolsos y los créditos se rigen por la Política de Pagos, Reembolsos y Créditos."], ["Uso permitido", "La aplicación debe usarse solo con fines lícitos y personales. Está prohibido: suministrar información falsa o de terceros sin autorización; usar medios de pago ajenos sin autorización del titular; hacer pedidos falsos o de broma; interferir con el funcionamiento de la aplicación; usar programas automáticos para navegar o extraer información; intentar descifrar u obtener el código fuente; compartir o usar de forma indebida las claves de acceso; revender los productos o beneficios con fines comerciales; realizar acciones que contravengan las leyes de la República de Panamá; y acosar, discriminar o agredir al personal del Comercio o a los repartidores."], ["Suspensión de cuentas", "El Comercio podrá suspender o cancelar cuentas que incumplan estos Términos, sin perjuicio de las acciones legales que correspondan. El Usuario puede eliminar su cuenta en cualquier momento desde Mi cuenta."], ["Propiedad intelectual", "El nombre, logotipo, imágenes, mascota y contenidos del Comercio, así como el diseño y el software de la aplicación, pertenecen a sus respectivos titulares y no pueden copiarse ni usarse sin autorización."], ["Limitación de responsabilidad", "El Comercio y el Proveedor Tecnológico no responden por fallas del dispositivo, del software o de la conexión a internet del Usuario, ni por servicios de terceros (telefonía, internet, procesadores de pago, mapas), ni por daños indirectos, lucro cesante o pérdida de oportunidad derivados del uso o de la imposibilidad de usar la aplicación, en la máxima medida permitida por la ley. Esto no limita los derechos que la ley panameña reconoce al consumidor."], ["Atención y reclamos", "Para cualquier reclamo, el Usuario puede escribir por WhatsApp al +507 6349-8263 o por Instagram @_porke_no. El Comercio atenderá los reclamos en un plazo razonable y conforme a la normativa de protección al consumidor."], ["Cambios en los Términos", "El Comercio podrá modificar estos Términos y publicará la versión actualizada en la aplicación con su fecha de última modificación, avisando por la aplicación o por correo cuando los cambios sean importantes. Dentro de los 10 días corridos siguientes al aviso, el Usuario podrá comunicar que no los acepta y eliminar su cuenta; pasado ese plazo se entenderán aceptados."], ["Ley aplicable", "Estos Términos se rigen por las leyes de la República de Panamá. Cualquier controversia será sometida a los tribunales competentes de la Ciudad de Panamá o a los que correspondan según la legislación vigente."]], "pr": [["Quién es responsable de tus datos", "El responsable del tratamiento de tus datos personales es el Comercio (Porké No?, Aguadulce, Panamá). DiCyn Marketing, como Proveedor Tecnológico, los trata únicamente por cuenta del Comercio y según sus instrucciones, para operar la aplicación. Esta política se basa en la Ley 81 de 2019 sobre Protección de Datos Personales, su reglamento y demás normas de Panamá."], ["Principios que seguimos", "• Lealtad y licitud: recogemos tus datos sin engaños y con tu consentimiento.\n• Finalidad: solo para fines legítimos que te informamos aquí, y no los guardamos más tiempo del necesario.\n• Proporcionalidad: pedimos únicamente lo necesario. Lo que no es obligatorio (correo, fecha de cumpleaños) es opcional.\n• Veracidad: te pedimos datos correctos y puedes corregirlos cuando quieras.\n• Seguridad y confidencialidad: protegemos tus datos y solo accede a ellos quien los necesita para atender tu pedido.\n• Transparencia y portabilidad: puedes saber qué datos tenemos y pedir una copia en un formato común."], ["Qué datos recopilamos y para qué", "• Cuenta y contacto: nombre, teléfono y, si inicias sesión con Google, tu nombre y correo. Tu número de teléfono es tu identificador: solo una cuenta puede usar un mismo número. Estos datos sirven para identificarte y avisarte de tu pedido.\n• Correo electrónico (opcional): para enviarte un comprobante digital si lo deseas.\n• Fecha de nacimiento (opcional: día, mes y año): para saludos de cumpleaños.\n• Dirección de entrega y referencias: para llevarte el pedido.\n• Ubicación: solo si lo permites en tu dispositivo, y solo mientras usas la aplicación. No te rastreamos en segundo plano.\n• Pedidos: qué pides, cuándo, cómo pagas y notas que escribas.\n• Comprobantes de pago: la captura que subes o envías al pagar con Yappy o transferencia.\n• Comunicación: calificaciones, comentarios y mensajes con el Comercio.\n• Datos básicos del dispositivo y de uso (por ejemplo, el idioma y si activaste notificaciones), para que la aplicación funcione bien."], ["Pagos y comprobantes", "La aplicación no recibe ni guarda datos de tarjetas. Si pagas con Yappy o transferencia, la captura del comprobante se usa únicamente para que el Comercio verifique que el pago llegó, y se conserva solo el tiempo necesario para ello y para los registros de ventas que exige la ley. Cuida que la captura no muestre información que no sea necesaria."], ["Para qué usamos tus datos", "Para recibir, preparar, entregar y cobrar tus pedidos; avisarte el estado de tu pedido (notificaciones); enviarte un comprobante si lo pides; atender reclamos y reembolsos; mejorar el servicio; y prevenir fraudes y usos indebidos. Los avisos de promociones solo te los enviamos si activas esa opción en Mi cuenta > Notificaciones, que es voluntaria y puedes desactivar cuando quieras. No tomamos decisiones automáticas sobre ti que te afecten legalmente."], ["Con quién los compartimos", "Con el personal del Comercio y los repartidores, solo lo necesario para entregar (nombre, teléfono y dirección); con el Proveedor Tecnológico, que opera la aplicación y el servicio de almacenamiento en la nube que usa; y con autoridades cuando la ley lo exija. No vendemos tus datos ni los usamos para publicidad de terceros."], ["Dónde se guardan", "Tus datos se guardan en servidores de un proveedor de almacenamiento en la nube. Si esos servidores están fuera de Panamá, tus datos podrán transferirse a ese país, aplicando medidas de seguridad y las garantías que exige la ley."], ["Tus derechos y plazos", "Tienes derecho, de forma gratuita, a acceder a tus datos, rectificarlos, cancelarlos (eliminarlos), oponerte a su tratamiento y pedir su portabilidad. Respondemos tu solicitud de acceso en un máximo de 10 días hábiles, corregimos datos erróneos en un máximo de 5 días hábiles y atendemos una solicitud de eliminación en un máximo de 10 días hábiles, o te explicamos por qué no procede. Puedes editar tus datos en Mi cuenta o escribirnos por WhatsApp al +507 6349-8263, indicando tu nombre y teléfono para identificarte."], ["Eliminar tu cuenta", "Puedes eliminar tu cuenta tú mismo desde Mi cuenta › Inicio de sesión y seguridad › Eliminar cuenta. Al hacerlo borramos al instante tu cuenta, tu perfil, tus ubicaciones guardadas, tus avisos, tus sellos y tus cupones. Tus pedidos anteriores se conservan sin tu nombre, teléfono, correo ni dirección, solo como registro de ventas que exige la ley; las capturas de pago asociadas a esos pedidos se guardan por el mismo motivo. Si tienes un pedido en curso, podrás eliminar tu cuenta cuando se entregue."], ["Cuánto tiempo los guardamos", "Mientras tu cuenta esté activa y, después, solo el tiempo que la ley exija para registros de ventas y pagos."], ["Seguridad y cuenta comprometida", "Aplicamos medidas técnicas y organizativas razonables, como conexiones cifradas y acceso restringido. Ningún sistema de internet es 100 % seguro, por lo que te pedimos cuidar tu dispositivo y tu cuenta de Google. Si sospechas que alguien usó tu cuenta o que tus datos se vieron afectados, escríbenos de inmediato por WhatsApp al +507 6349-8263. Si ocurriera un incidente que te afecte, te avisaremos conforme a la ley."], ["Menores de edad", "La aplicación no está dirigida a menores de 18 años. Si recibimos datos de un menor sin autorización de su representante legal, los eliminaremos a la mayor brevedad."], ["Ubicación del repartidor", "Mientras tu pedido va en camino, la aplicación te muestra la ubicación del repartidor en el mapa. Esa ubicación solo la ve el cliente de ese pedido y el local, y se deja de mostrar al entregar."], ["Cambios, ley aplicable y contacto", "Podemos actualizar esta política y publicaremos la fecha de la última modificación; si el cambio es importante, te avisaremos por la aplicación. Se rige por las leyes de la República de Panamá y sus tribunales competentes. Consultas: WhatsApp +507 6349-8263 o Instagram @_porke_no."]], "pg": [["Acerca de esta política", "Esta Política regula los pagos, reembolsos y créditos de la aplicación de Porké No? (el “Comercio”). Complementa los Términos y Condiciones de Uso. El Comercio es quien vende y cobra; DiCyn Marketing solo provee la tecnología. El uso de la aplicación para pagar supone la aceptación de esta Política."], ["Métodos de pago", "Según lo que el Comercio habilite, el Usuario podrá pagar con Yappy, transferencia bancaria o efectivo (al repartidor o en el local). El Comercio no recibe pagos con tarjeta a través de la aplicación. El precio de los productos, el envío, la tarifa de servicio de la aplicación ($0.15 por pedido) y el total se muestran antes de confirmar."], ["Yappy y transferencia", "Al elegir Yappy o transferencia, el Usuario dispone de 5 minutos para enviar el pago y subir en la aplicación la captura del comprobante. Subir el comprobante no confirma el pedido: el Comercio verificará en su banca en línea que el dinero haya llegado y, solo entonces, aceptará el pedido y comenzará su preparación. Si el pago no se puede verificar, la aplicación avisará al Usuario para que revise y suba nuevamente su comprobante o elija pagar en efectivo al recibir. Presentar comprobantes falsos o alterados está prohibido y puede dar lugar a la suspensión de la cuenta y a las acciones legales que correspondan."], ["Efectivo", "El pago se hace al recibir el pedido (al motorizado en delivery o en el local al recoger); el repartidor ve en su pantalla si debe cobrar o si el pedido ya fue pagado. Se recomienda tener el monto lo más exacto posible. Si el Usuario no recibe el pedido o rechaza pagarlo sin causa justificada, el Comercio podrá suspender su cuenta."], ["Verificación y seguridad", "Para cumplir las normas de prevención de fraude y de lavado de dinero y financiamiento del terrorismo, el Comercio podrá solicitar información para verificar la identidad del Usuario o la autenticidad de un pago, y podrán rechazar o retener operaciones sospechosas."], ["Cancelaciones", "El Usuario puede cancelar su pedido sin costo mientras el Comercio no haya comenzado a prepararlo, escribiendo por WhatsApp al +507 6349-8263. Una vez iniciada la preparación, el pedido no puede cancelarse, salvo que el Comercio acepte hacerlo."], ["Reembolsos", "Procede el reembolso cuando el pedido no se entregue por causa del Comercio, llegue incompleto o equivocado, se cancele a tiempo, o cuando haya un cobro duplicado o erróneo. Los pagos por Yappy o transferencia se devuelven por el mismo medio, normalmente dentro de 5 días hábiles, o como crédito si el Usuario lo prefiere. Los pagos en efectivo se devuelven por transferencia o como crédito. Una vez emitido, el reembolso es definitivo y no se admitirán nuevas solicitudes por el mismo pedido. Todo reembolso exige que el Usuario haya reclamado en las 24 horas siguientes a la entrega."], ["Créditos y cupones del Comercio", "El Comercio puede otorgar créditos o cupones como promoción, compensación o reembolso, cuyas condiciones (monto, vigencia y productos aplicables) se indicarán en cada caso. No son dinero electrónico ni una cuenta de depósito. Solo sirven para pagar pedidos en el Comercio. No pueden canjearse por efectivo, cheques, monedas virtuales, abonos a cuentas bancarias o billeteras, ni transferirse a otro usuario. Si el pedido supera el valor del crédito, la diferencia se paga con otro método habilitado; si es menor, el saldo restante se mantiene hasta su vencimiento. Un crédito vencido no da derecho a reclamo, y el Comercio puede cancelarlos si detecta uso indebido."], ["Usos prohibidos", "No está permitido usar créditos, cupones o medios de pago: de forma contraria a esta Política; para reventa o fines comerciales; como pago de obligaciones con terceros; con medios de pago ajenos sin autorización; ni para ningún propósito ilegal. El incumplimiento puede dar lugar a la suspensión o cancelación de la cuenta y de los créditos disponibles."], ["Comprobante y factura", "El correo electrónico para recibir comprobante es opcional. El comprobante digital no sustituye la factura fiscal; el Comercio emitirá su factura conforme a las normas tributarias de Panamá cuando corresponda."], ["Cambios y ley aplicable", "El Comercio podrá modificar esta Política y avisará por la aplicación o por correo. Se rige por las leyes de la República de Panamá y sus tribunales competentes en la Ciudad de Panamá."]]},LGN={"tc": "Términos y Condiciones de Uso", "pr": "Política de Privacidad y Protección de Datos", "pg": "Política de Pagos, Reembolsos y Créditos"},termsOk=(function(){try{return localStorage.getItem('pk_tos')=='1'}catch(e){return false}})();
